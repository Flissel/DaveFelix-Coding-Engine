# =============================================================================
# coding-engine frontend nginx vhost (Phase 2c — Swarm config: object)
# =============================================================================
# Replaces the Vite dev-server's built-in proxy. Two jobs:
#   1. Serve the built SPA with history-API fallback (try_files → index.html)
#      so client-side routes (deep links) don't 404.
#   2. Proxy /api/v1 → coding-api:8000 (overlay DNS), INCLUDING WebSocket
#      upgrade — the live-generation stream is /api/v1/engine/generation/ws
#      (engineApi.ts:296, same-origin window.location.host). Without the
#      Upgrade/Connection headers the WS handshake fails and live streaming
#      breaks silently.
# Listens on 5173 to keep the published host port identical to the old
# dev-server (no consumer/launcher port change).
# =============================================================================

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker/Swarm embedded DNS. nginx resolves proxy_pass upstreams at
    # STARTUP by default → if coding-api isn't up yet (or restarts) nginx
    # aborts with "host not found in upstream". Using a $variable in
    # proxy_pass + an explicit resolver makes nginx resolve LAZILY per
    # request via Docker's embedded resolver (127.0.0.11), so frontend
    # survives coding-api restarts and start-order races. valid=10s keeps
    # the cache short so a rescheduled coding-api task is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend API + WebSocket. `/api/v1` is the ONLY proxied prefix
    # (vite.config.ts:19). coding-api = the swarm overlay service name;
    # via $upstream so resolution is lazy (see resolver above).
    location /api/v1 {
        set $upstream_api http://coding-api:8000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (/api/v1/engine/generation/ws)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # generation streams can be long-lived — don't cut them at 60s.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
