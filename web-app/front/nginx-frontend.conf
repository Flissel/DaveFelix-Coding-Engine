# Minimal coding-engine frontend nginx vhost.
# Auto-generated 2026-05-20 to unblock `docker stack deploy vibemind` —
# the stack referenced this file but it was missing on disk (a side
# effect of an earlier bind-mount accident: the same directory contains
# `nginx-frontend.conf;C/` which is what Windows/Docker created when a
# config file path was misinterpreted as a `path;drive` mount).
#
# The coding-frontend image (vibemind-coding-frontend:static) isn't
# currently built in this environment, so this config is effectively
# unused at runtime; it exists purely so `docker stack deploy` can
# upload the swarm config object without crashing the whole stack.
# When the coding-frontend service is properly built, this file can
# be replaced with the real production vhost.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
